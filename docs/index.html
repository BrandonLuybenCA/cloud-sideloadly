<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Sideloadly | COMMAND CENTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background: #0a0a0c; color: #fff; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow { box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        .progress-bar { transition: width 0.5s ease-in-out; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 overflow-hidden">
    <!-- Background Decor -->
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-900/20 blur-[120px] rounded-full"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-purple-900/20 blur-[120px] rounded-full"></div>

    <div class="w-full max-w-lg glass rounded-3xl p-8 relative z-10">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 italic">CLOUD SIDELOADLY</h1>
                <p class="text-xs uppercase tracking-widest text-blue-400 font-bold opacity-80 mt-1">PROD VERSION 4.0 | STEALTH</p>
            </div>
            <div id="status-dot" class="w-3 h-3 bg-green-500 rounded-full animate-pulse shadow-[0_0_10px_#22c55e]"></div>
        </div>

        <!-- Forms -->
        <div id="setup-form" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-gray-400 font-bold ml-1">Apple ID</label>
                    <input type="email" id="appleId" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 focus:outline-none focus:border-blue-500 transition-all text-sm" placeholder="user@icloud.com">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-gray-400 font-bold ml-1">Password</label>
                    <input type="password" id="applePass" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 focus:outline-none focus:border-blue-500 transition-all text-sm" placeholder="App-Specific">
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] uppercase text-gray-400 font-bold ml-1">Stealth App Name</label>
                <input type="text" id="fakeName" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 focus:outline-none focus:border-blue-500 transition-all text-sm" value="Calculator">
            </div>

            <div class="mt-6">
                <label for="ipaFile" class="block w-full border-2 border-dashed border-white/10 rounded-2xl p-8 text-center cursor-pointer hover:border-blue-500 hover:bg-blue-500/5 transition-all">
                    <input type="file" id="ipaFile" class="hidden" accept=".ipa">
                    <div id="file-label" class="text-sm text-gray-400">Drag & Drop or <span class="text-blue-400 font-bold">Browse IPA</span></div>
                </label>
            </div>

            <button onclick="launchSideload()" id="launchBtn" class="w-full bg-gradient-to-r from-blue-600 to-blue-400 text-white font-bold py-4 rounded-2xl mt-8 shadow-lg hover:scale-[1.02] active:scale-95 transition-all uppercase tracking-widest text-sm">
                Initialize Stealth Sign
            </button>
        </div>

        <!-- Progress (Hidden by Default) -->
        <div id="progress-view" class="hidden space-y-8 py-8">
            <div class="text-center">
                <p id="current-task" class="text-blue-400 font-bold text-sm uppercase tracking-widest mb-2">Injecting Payload...</p>
                <div class="w-full bg-white/5 h-2 rounded-full overflow-hidden">
                    <div id="bar" class="progress-bar w-0 h-full bg-gradient-to-r from-blue-500 to-purple-600"></div>
                </div>
            </div>
            
            <div id="action-prompt" class="hidden bg-blue-500/10 border border-blue-500/20 rounded-2xl p-4 text-center">
                <p class="text-sm text-blue-300 font-bold animate-bounce">Flipping VPN Switch... READY</p>
            </div>
        </div>
    </div>

    <script>
        async function launchSideload() {
            const btn = document.getElementById('launchBtn');
            const file = document.getElementById('ipaFile').files[0];
            const appleId = document.getElementById('appleId').value;
            const applePass = document.getElementById('applePass').value;
            const fakeName = document.getElementById('fakeName').value;

            if (!file || !appleId || !applePass) return alert("All fields required.");

            // Switch to progress view
            document.getElementById('setup-form').classList.add('hidden');
            document.getElementById('progress-view').classList.remove('hidden');
            updateProgress(10, "Compressing IPA...");

            // Get PAT
            let pat = localStorage.getItem('gh_pat') || prompt("Enter GitHub PAT:");
            localStorage.setItem('gh_pat', pat);

            try {
                // Step 1: Direct GitHub Ingestion (Committing to a temp branch)
                updateProgress(30, "Establishing Secure Tunnel...");
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async () => {
                    const base64Content = reader.result.split(',')[1];
                    const branchName = `payload-${Math.floor(Math.random() * 100000)}`;

                    // Create branch
                    const mainBranch = await fetch('https://api.github.com/repos/BrandonLuybenCA/cloud-sideloadly/git/refs/heads/main', {
                        headers: { 'Authorization': `token ${pat}` }
                    }).then(r => r.json());

                    await fetch('https://api.github.com/repos/BrandonLuybenCA/cloud-sideloadly/git/refs', {
                        method: 'POST',
                        headers: { 'Authorization': `token ${pat}` },
                        body: JSON.stringify({ ref: `refs/heads/${branchName}`, sha: mainBranch.object.sha })
                    });

                    // Commit IPA
                    updateProgress(60, "Syncing to Cloud Engine...");
                    await fetch(`https://api.github.com/repos/BrandonLuybenCA/cloud-sideloadly/contents/inbox/payload.ipa`, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${pat}` },
                        body: JSON.stringify({
                            message: "Ingest Payload",
                            content: base64Content,
                            branch: branchName
                        })
                    });

                    // Trigger Action
                    updateProgress(80, "Waking up Signer...");
                    await fetch('https://api.github.com/repos/BrandonLuybenCA/cloud-sideloadly/actions/workflows/sideload.yml/dispatches', {
                        method: 'POST',
                        headers: { 'Authorization': `token ${pat}` },
                        body: JSON.stringify({
                            ref: branchName,
                            inputs: { apple_id: appleId, apple_password: applePass, fake_name: fakeName }
                        })
                    });

                    updateProgress(100, "WAITING FOR VPN CONNECTION...");
                    document.getElementById('action-prompt').classList.remove('hidden');
                };

            } catch (err) {
                alert("Critical failure in ingestion. Check console.");
                console.error(err);
            }
        }

        function updateProgress(val, task) {
            document.getElementById('bar').style.width = val + '%';
            document.getElementById('current-task').innerText = task;
        }

        document.getElementById('ipaFile').onchange = (e) => {
            document.getElementById('file-label').innerText = e.target.files[0].name;
        };
    </script>
</body>
</html>
