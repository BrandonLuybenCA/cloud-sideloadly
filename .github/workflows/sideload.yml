name: Cloud Sideloadly PROD
on:
  workflow_dispatch:
    inputs:
      apple_id:
        description: 'Apple ID Email'
        required: true
      apple_password:
        description: 'Apple ID Password'
        required: true
      ipa_url:
        description: 'IPA URL'
        required: true
      fake_name:
        description: 'Fake App Name'
        required: false
        default: 'Calculator'

jobs:
  sideload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsign libimobiledevice-utils ideviceinstaller jq curl socat strongswan libcharon-extra-plugins libcharon-extauth-plugins
          curl -L -o netmuxd https://github.com/jkcoxson/netmuxd/releases/download/v0.1.4/x86_64-linux-netmuxd
          sudo mv netmuxd /usr/local/bin/ && sudo chmod +x /usr/local/bin/netmuxd
          
      - name: Start Sideloading Engine
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
          APPLE_ID: ${{ github.event.inputs.apple_id }}
          APPLE_PASSWORD: ${{ github.event.inputs.apple_password }}
          IPA_URL: ${{ github.event.inputs.ipa_url }}
          FAKE_NAME: ${{ github.event.inputs.fake_name }}
          UDID: ${{ secrets.UDID }}
        run: |
          python3 scripts/engine.py --mode sideload
