name: Cloud Sideloadly PROD
on:
  workflow_dispatch:
    inputs:
      apple_id:
        description: 'Apple ID Email'
        required: true
      ipa_url:
        description: 'Direct IPA Link'
        required: true
      fake_name:
        description: 'Fake App Name'
        required: false

jobs:
  sideload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y zsign libimobiledevice-utils ideviceinstaller jq curl
          
          # Install netmuxd
          curl -L -o netmuxd https://github.com/jkcoxson/netmuxd/releases/download/v0.1.4/x86_64-linux-netmuxd
          sudo mv netmuxd /usr/local/bin/
          sudo chmod +x /usr/local/bin/netmuxd
          
      - name: Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ focal main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install cloudflare-warp -y
          warp-cli --accept-tos register
          warp-cli --accept-tos connect
          
      - name: Start Pinggy Tunnel
        run: |
          ssh -o StrictHostKeyChecking=no -R0:localhost:500 tcp@a.pinggy.io > pinggy.log 2>&1 &
          sleep 15
          PINGGY_URL=$(grep -oE "[a-z0-9]+\.a\.pinggy\.link:[0-9]+" pinggy.log | head -n 1)
          echo "CONNECT VPN TO: $PINGGY_URL"
          
      - name: Start VPN
        run: sudo bash scripts/setup_vpn.sh

      - name: Sign & Deploy
        run: |
          python3 scripts/sign_and_deploy.py --ipa "${{ github.event.inputs.ipa_url }}" --name "${{ github.event.inputs.fake_name }}" --id "com.stealth.app"
