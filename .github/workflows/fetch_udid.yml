name: 0. Fetch My UDID
on:
  workflow_dispatch:

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libimobiledevice-utils strongswan jq curl
          
          # Install netmuxd
          curl -L -o netmuxd https://github.com/jkcoxson/netmuxd/releases/download/v0.1.4/x86_64-linux-netmuxd
          sudo mv netmuxd /usr/local/bin/
          sudo chmod +x /usr/local/bin/netmuxd
          
      - name: Start VPN
        run: sudo bash scripts/setup_vpn.sh

      - name: Start Pinggy Tunnel
        run: |
          # Start Pinggy TCP tunnel for VPN (port 500)
          # We use a temporary file to capture the URL
          ssh -o StrictHostKeyChecking=no -R0:localhost:500 tcp@a.pinggy.io > pinggy.log 2>&1 &
          sleep 15
          # Capture the assigned URL from the log
          PINGGY_URL=$(grep -oE "[a-z0-9]+\.a\.pinggy\.link:[0-9]+" pinggy.log | head -n 1)
          
          if [ -z "$PINGGY_URL" ]; then
            echo "Failed to get Pinggy URL. Retrying with alternative capture..."
            # Try capturing from full log if short grep fails
            PINGGY_URL=$(cat pinggy.log | grep -o '.*\.a\.pinggy\.link:[0-9]*')
          fi

          echo "--------------------------------------------------"
          echo "STEP 1: OPEN IPHONE SETTINGS > VPN > ADD CONFIG"
          echo "TYPE: IKEv2"
          echo "DESCRIPTION: Sideloadly"
          echo "SERVER: $PINGGY_URL"
          echo "REMOTE ID: @sideloadly-runner"
          echo "LOCAL ID: @client"
          echo "USER AUTHENTICATION: None"
          echo "MACHINE AUTHENTICATION: Shared Secret"
          echo "SHARED SECRET: sideloadly123"
          echo "--------------------------------------------------"

      - name: Discovery
        run: |
          for i in {1..5}; do
            sudo netmuxd --host 10.10.10.$i &
          done
          python3 scripts/discovery.py
