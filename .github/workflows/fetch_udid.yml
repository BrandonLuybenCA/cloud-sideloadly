name: 0. Fetch My UDID
on:
  workflow_dispatch:

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libimobiledevice-utils jq curl socat
      - name: Install netmuxd
        run: |
          curl -L -o netmuxd https://github.com/jkcoxson/netmuxd/releases/download/v0.1.4/x86_64-linux-netmuxd
          sudo mv netmuxd /usr/local/bin/
          sudo chmod +x /usr/local/bin/netmuxd
      - name: Start VPN Server
        run: sudo bash scripts/setup_vpn.sh
      - name: Start Tunnel and Bridge
        run: |
          # Bridge TCP 5000 (from tunnel) to UDP 500 (VPN)
          sudo socat TCP4-LISTEN:5000,fork,reuseaddr UDP4:localhost:500 &
          # Bridge TCP 4500 (alt) to UDP 4500 (VPN)
          sudo socat TCP4-LISTEN:4501,fork,reuseaddr UDP4:localhost:4500 &
          python3 scripts/tunnel_manager.py
      - name: UDID Discovery Loop
        run: |
          # Wait for connection
          echo "[*] Waiting for iPhone to connect to VPN..."
          for i in {1..20}; do
            # Use a slightly more targeted netmuxd scan
            sudo netmuxd --host 10.10.10.1 &
            python3 scripts/discovery.py && break || sleep 5
          done
