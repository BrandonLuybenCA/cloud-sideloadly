name: 0. Fetch My UDID
on:
  workflow_dispatch:

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libimobiledevice-utils jq curl socat strongswan strongswan-pki libcharon-extra-plugins libcharon-extauth-plugins
          curl -L -o netmuxd https://github.com/jkcoxson/netmuxd/releases/download/v0.1.4/x86_64-linux-netmuxd
          sudo mv netmuxd /usr/local/bin/
          sudo chmod +x /usr/local/bin/netmuxd
      - name: Run Engine
        run: |
          # The engine handles VPN, Tunnel, and Discovery in one go
          sudo python3 scripts/engine.py
