name: 0. Fetch My UDID
on:
  workflow_dispatch:

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libimobiledevice-utils strongswan jq curl
          
          # Fix netmuxd download
          curl -L -o netmuxd https://github.com/jkcoxson/netmuxd/releases/download/v0.1.4/x86_64-linux-netmuxd
          sudo mv netmuxd /usr/local/bin/
          sudo chmod +x /usr/local/bin/netmuxd
          
      - name: Start VPN
        run: sudo bash scripts/setup_vpn.sh

      - name: Start Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok
          # Use Secret for Ngrok token
          ngrok config add-authtoken ${{ secrets.NGROK_TOKEN }}
          ngrok tcp 500 --log=stdout > ngrok.log &
          sleep 10
          NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          CLEAN_URL=$(echo $NGROK_URL | sed 's/tcp:\/\///')
          HOST=$(echo $CLEAN_URL | cut -d: -f1)
          
          echo "--------------------------------------------------"
          echo "STEP 1: OPEN IPHONE SETTINGS > VPN > ADD CONFIG"
          echo "SERVER: $HOST"
          echo "REMOTE ID: @sideloadly-runner"
          echo "LOCAL ID: @client"
          echo "SHARED SECRET: sideloadly123"
          echo "--------------------------------------------------"

      - name: Discovery
        run: |
          for i in {1..5}; do
            sudo netmuxd --host 10.10.10.$i &
          done
          python3 scripts/discovery.py
