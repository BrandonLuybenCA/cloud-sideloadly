name: 0. Fetch My UDID
on:
  workflow_dispatch:

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libimobiledevice-utils jq curl socat strongswan libcharon-extra-plugins libcharon-extauth-plugins
          
          # Install netmuxd
          curl -L -o netmuxd https://github.com/jkcoxson/netmuxd/releases/download/v0.1.4/x86_64-linux-netmuxd
          sudo mv netmuxd /usr/local/bin/ && sudo chmod +x /usr/local/bin/netmuxd
          
      - name: Run Engine
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
        run: |
          python3 -u scripts/engine.py --mode discovery
