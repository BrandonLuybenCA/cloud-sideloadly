name: 0. Fetch My UDID
on:
  workflow_dispatch:

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y libimobiledevice-utils jq curl socat
          
          # Install netmuxd binary
          curl -L -o netmuxd https://github.com/jkcoxson/netmuxd/releases/download/v0.1.4/x86_64-linux-netmuxd
          sudo mv netmuxd /usr/local/bin/
          sudo chmod +x /usr/local/bin/netmuxd
          
      - name: Start VPN Server
        run: sudo bash scripts/setup_vpn.sh

      - name: Start Pinggy Bridge
        run: |
          # Start Pinggy TCP tunnel on a local port
          ssh -o StrictHostKeyChecking=no -R0:localhost:5000 tcp@a.pinggy.io > pinggy.log 2>&1 &
          sleep 10
          
          # Extract URL
          PINGGY_URL=$(grep -oE "[a-z0-9]+\.a\.pinggy\.link:[0-9]+" pinggy.log | head -n 1)
          
          # Bridge Pinggy TCP traffic to local UDP VPN port 500
          sudo socat TCP4-LISTEN:5000,fork UDP4:localhost:500 &
          
          echo "--------------------------------------------------"
          echo "VPN STATUS: READY"
          echo "SERVER: $PINGGY_URL"
          echo "REMOTE ID: @sideloadly-runner"
          echo "LOCAL ID: @client"
          echo "SHARED SECRET: sideloadly123"
          echo "--------------------------------------------------"

      - name: Discovery Loop
        run: |
          # Start netmuxd scanning the virtual VPN subnet
          for i in {1..10}; do
            sudo netmuxd --host 10.10.10.$i &
          done
          
          # Give the connection time to establish
          python3 scripts/discovery.py
